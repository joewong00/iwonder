<footer class="site-footer bg-dark">
  <data class="u-url" href="{{ .Site.BaseURL }}"></data>
  <div class="container">

    <nav class="nav nav-pills nav-fill">
      <a class="footer-heading" style="color: grey;" href="{{ .Site.BaseURL }}">
        <logo><img src="{{ "images/iwonder-logo.png" | absURL }}" alt="LOGO" height="30px"></logo>{{ .Site.Title }}
      </a>
      <a class="nav-item">
        {{ range .Site.Menus.main }}
          {{ if ne .Name "Home" }}
          <li>
            <a class="nav-link" href="{{ .URL | absURL }}">{{ .Name }}</a>
          </li>
          {{ end }}
        {{ end }}
      </a>
    </nav>

    <hr style="opacity:0.3; color:gray; margin-top: 0px; margin-bottom: 10px; padding: -1px;">

    <div class="row justify-content-between">
      <div class="col-md-4">
        <ul class="contact-list">
          {{ partial "social.html" . }}
        </ul>
      </div>
      <div class="col-md-6 text-md-end" style="color:gray;">
        {{ .Site.Params.description }}
      </div>
    </div>

  </div>
</footer>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const htmlElement = document.documentElement;

    const currentTheme = htmlElement.getAttribute('data-bs-theme');
    updateIcon(currentTheme);

    themeToggle.addEventListener('click', () => {
      const activeTheme = htmlElement.getAttribute('data-bs-theme');
      const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
      
      htmlElement.setAttribute('data-bs-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateIcon(newTheme);
    });

    function updateIcon(theme) {
      if (theme === 'dark') {
        themeIcon.classList.remove('bi-moon-stars-fill');
        themeIcon.classList.add('bi-sun-fill');
      } else {
        themeIcon.classList.remove('bi-sun-fill');
        themeIcon.classList.add('bi-moon-stars-fill');
      }
    }

    // Fix Masonry overlapping bug by reloading layout after images load
    const masonryGrid = document.querySelector('[data-masonry]');
    if (masonryGrid && typeof imagesLoaded !== 'undefined') {
      imagesLoaded(masonryGrid).on('progress', function() {
        if (typeof Masonry !== 'undefined') {
          const msnry = Masonry.data(masonryGrid);
          if (msnry) {
            msnry.layout();
          }
        }
      });
    }
  });
</script>
